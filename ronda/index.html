<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Ronda NQSP</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ronda NQSP">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f5a5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: barra fixa no topo, conteúdo em coluna única larga (iPad retrato/paisagem), linhas de item com botões grandes */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#18211f; --muted:#5d6b67; --line:#d5ddda;
  --accent:#0f5a5c; --accent-ink:#ffffff; --accent-soft:#e1eeed;
  --c:#1f7a46; --c-soft:#dcf1e4; --nc:#b3261e; --nc-soft:#f8dedb;
  --na:#5d6b67; --na-soft:#e7ebea; --nv:#9a6400; --nv-soft:#fbecd0;
  --warn:#9a6400; --warn-soft:#fff4dc;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.stick{position:sticky;top:0;z-index:20;background:var(--bg)}
.top{background:var(--accent);color:var(--accent-ink);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px}
.top h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;opacity:.85;font-weight:400}
.top button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:8px 12px;font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0;font-weight:650}
.row{display:flex;flex-wrap:wrap;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 180px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.panel>.field{flex:0 0 auto}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
textarea{resize:vertical;min-height:80px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;min-height:44px;font-weight:550}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--nc);border-color:var(--nc)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:10px 14px;min-width:48px;min-height:44px;border-right:1px solid var(--line);font-weight:600}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.banner{border-radius:var(--r);padding:12px 16px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--warn)}
.banner.ok{background:var(--c-soft);border-color:var(--c)}
.banner.danger{background:var(--nc-soft);border-color:var(--nc)}
.banner.danger b{color:var(--nc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-weight:700;border-radius:6px;padding:6px 10px;background:var(--accent-soft);border:1px solid var(--accent)}
.chip.res{background:var(--bg);border-style:dashed;color:var(--muted)}
.chip.usado{opacity:.45;text-decoration:line-through}
.lchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:4px 4px 4px 10px}
.lchip b{font-family:var(--mono)}
.lchip small{font-size:11px;color:var(--muted)}
.lchip button{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-height:40px;padding:4px 10px;font-size:13px;font-weight:600}
.lchip.usado{opacity:.55}
.aviso{font-size:13px;color:var(--nc);font-weight:600}

.list{display:flex;flex-direction:column;gap:8px}
.rcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;text-align:left;width:100%}
.rcard .t{font-weight:650}
.rcard .m{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:650;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.and{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--c-soft);color:var(--c)}
.pill.exp{background:var(--na-soft);color:var(--na)}

.tabs{display:flex;gap:6px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.tabs:empty{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:44px;font-weight:600;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.tabs button small{font-weight:500;font-size:11px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs button[aria-selected="true"] small{color:inherit;opacity:.85}

.bloco{display:flex;flex-direction:column}
.bloco>h3{margin:0;padding:10px 16px;font-size:14px;font-weight:700;background:var(--accent-soft);color:var(--ink);border-radius:var(--r) var(--r) 0 0;border:1px solid var(--line);border-bottom:0}
.item{background:var(--surface);border:1px solid var(--line);border-top:0;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.bloco .item:last-child{border-radius:0 0 var(--r) var(--r)}
.item .txt{min-width:0}
.item .cod{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);margin-right:6px}
.item .fonte{font-size:11px;font-weight:650;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;white-space:nowrap}
.item .auto{font-size:11px;font-weight:650;color:var(--nv);margin-left:6px}
.item .crit{grid-column:1/-1;font-size:13px;color:var(--muted);background:var(--bg);border-radius:6px;padding:8px 10px}
.item .extra{grid-column:1/-1}
.item .extra input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
.item .extra input.req{border-color:var(--nv);background:var(--nv-soft)}
.info{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 0 0;display:block}
.marks{display:flex;gap:6px}
.marks button{min-width:54px;min-height:48px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.marks button[data-v="C"][aria-pressed="true"]{background:var(--c-soft);border-color:var(--c);color:var(--c)}
.marks button[data-v="NC"][aria-pressed="true"]{background:var(--nc-soft);border-color:var(--nc);color:var(--nc)}
.marks button[data-v="NA"][aria-pressed="true"]{background:var(--na-soft);border-color:var(--na);color:var(--na)}
.marks button[data-v="NV"][aria-pressed="true"]{background:var(--nv-soft);border-color:var(--nv);color:var(--nv)}
.marks button[data-v="S"][aria-pressed="true"],.marks button[data-v="INT"][aria-pressed="true"],.marks button[data-v="SR"][aria-pressed="true"],.marks button[data-v="ADM"][aria-pressed="true"]{background:var(--nc-soft);border-color:var(--nc);color:var(--nc)}
.marks button[data-v="N"][aria-pressed="true"]{background:var(--c-soft);border-color:var(--c);color:var(--c)}
.item.vazio{box-shadow:inset 4px 0 0 var(--warn)}

.pend{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.pend li{padding:8px 12px;border-radius:8px;background:var(--warn-soft);font-size:14px}
.pend li.ok{background:var(--c-soft)}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:8px;justify-content:space-between;align-items:center}
.bottom .st{font-size:13px;color:var(--muted)}

.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--surface);border-radius:var(--r);padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px}
.modal p{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:90vw}

/* Visão REG 005 */
.reg{background:#fff;color:#111;border:1px solid var(--line);border-radius:var(--r);padding:16px;overflow-x:auto}
.reg table{border-collapse:collapse;width:100%;min-width:720px;font-size:12px}
.reg th,.reg td{border:1px solid #888;padding:4px 6px;vertical-align:middle}
.reg th{background:#e9eeed}
.reg td.v{text-align:center;font-weight:700;width:64px}
.reg td.tot{text-align:center;white-space:nowrap;width:120px;font-variant-numeric:tabular-nums}
.reg .meta{background:#d9e4e3;font-weight:700}
.reg .hdr{display:flex;flex-wrap:wrap;gap:6px 24px;margin-bottom:10px;font-size:13px}
.reg .nota{font-size:11px;color:#444;margin-top:8px}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  .top,.tabs,.bottom,.noprint{display:none!important}
  .wrap{padding:0;max-width:none}
  .reg{border:0;padding:0;overflow:visible}
  .reg table{min-width:0}
}
@media (max-width:640px){
  .item{grid-template-columns:1fr}
  .marks button{flex:1}
  .marks{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stick">
<header class="top">
  <h1 id="ttl">Ronda NQSP <span class="sub" id="ttlsub"></span></h1>
  <button id="btnHome" hidden>Rondas</button>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
</div>
<main class="wrap" id="app"></main>
<div class="bottom" id="bottom" hidden></div>

<script>
'use strict';
const APP_VERSION = '1.3 · 23/10/2026';
const MAX_PCT = 16;
const FORM_VERSION = 'REG005SEG-v00/folha-v03.1';
const STORE_KEY = 'rondaNQSP.v1';

/* ---------- Instrumento: espelha a folha de campo v03.1 (REG 005 SEG v00), mesma ordem ---------- */
const BLOCOS = [
 {nome:'Meta 1 - Identificação do paciente', itens:[
  ['M1.1','Identificadores na placa beira-leito corretos (conferem com prontuário) e legíveis','OD+PR','C: placa presente, legível e conferindo com o prontuário. NC: ausente, ilegível ou divergente. Nunca dar C sem conferir com o prontuário.'],
  ['M1.2','Nome completo e data de nascimento em todas as formas de identificação no leito','OD','C: os dois identificadores em placa, pulseira e demais identificações. Nome abreviado = NC.'],
  ['M1.3','Paciente com pulseira de identificação','OD','C: pulseira no membro do paciente. NC: ausente, guardada ou presa à cama.'],
  ['M1.4','Identificadores da pulseira corretos e legíveis (se M1.3 = C)','OD+PR','Se M1.3 = NC, marcar NA (D1). Composto: correto e legível.'],
  ['M1.5','Paciente/cuidador afirma ter recebido orientação sobre o propósito da pulseira','EN','Pergunta aberta: "para que serve essa pulseira?". NA se não responde e não há acompanhante.'],
  ['M1.6','Equipe realiza o rito de conferência da identificação durante o cuidado (só se observado)','OD','Sem ato de cuidado observado = NV. Não substituir observação por pergunta à equipe.'],
  ['M1.7','Paciente/cuidador afirma que a pulseira é conferida antes de cada procedimento','EN','NA se não responde e não há acompanhante.']
 ]},
 {nome:'Meta 2 - Comunicação efetiva', itens:[
  ['M2.1','Paciente/acompanhante ciente do quadro, diagnóstico, plano de cuidado e previsão de alta (os 4)','EN','Composto de 4 elementos: C só com os quatro. "O que o senhor entendeu do tratamento e de quando vai para casa?"'],
  ['M2.2','Evidência de preenchimento da transição de cuidados (se houve transição)','PR','Elegível se houve transição. [A CONFIRMAR] instrumento institucional.'],
  ['M2.3','Registro de SBAR na passagem de plantão','PR','[A CONFIRMAR] onde o SBAR é registrado (prontuário ou passômetro).'],
  ['M2.4','Resultado crítico comunicado e documentado dentro do tempo acordado (se houve)','PR','Composto: comunicado, documentado e no prazo. NA se não houve resultado crítico na janela.'],
  ['M2.5','Registro de recebimento do resultado crítico (se houve)','PR','Mesma elegibilidade do M2.4.'],
  ['M2.6','Registro de conduta após o resultado crítico (se houve)','PR','Mesma elegibilidade do M2.4.']
 ]},
 {nome:'Meta 3 - Medicamentos', itens:[
  ['M3.1','Medicações em uso identificadas com o nome (nada instalado = NV)','OD','C: tudo instalado ou preparado à beira-leito identificado. NV: prescrição sem nada instalado no momento. NA: sem medicação prescrita.'],
  ['M3.2','MAV prescrito com dupla checagem (se MAV)','PR+OD','Elegível se há MAV prescrito. Sem padrão de registro da dupla checagem: NV com motivo.'],
  ['M3.3','Administração no horário prescrito e aprazado','PR','Comparar checagem com aprazamento nas últimas 24h. Procurar checagem antecipada.'],
  ['M3.5','Paciente/cuidador afirma receber informação sobre o medicamento antes da administração','EN','NA se não responde e não há acompanhante.']
 ]},
 {nome:'Meta 6 - Lesão por pressão', itens:[
  ['LP.1','Risco de LP avaliado pela Braden na admissão','PR','C: escala com escore no registro de admissão.'],
  ['LP.2','Avaliação da pele na admissão registrada em prontuário','PR','C: descrição da pele no registro de admissão.'],
  ['LP.3','Braden reavaliada nas últimas 24h','PR','C: escala registrada nas últimas 24h.'],
  ['LP.4','Risco de LP sinalizado na pulseira e na identificação do leito (se RB = M ou A)','OD+PR','NA se risco baixo. Sem Braden: NV (D2). Composto: pulseira e leito.'],
  ['LP.5','Prescrição de enfermagem ajustada ao risco de LP (se RB avaliado)','PR','Sem Braden registrado: NV (D2).'],
  ['LP.6','Mudança de decúbito conforme prescrição e relógio de LP (se RB = A)','OD+PR','Só risco alto. NA se deambula ou risco baixo/moderado.'],
  ['LP.7','Paciente em uso de colchão indicado','OD','Ao marcar NC, anotar se é falta do recurso ou conduta. [A CONFIRMAR] critério de indicação.'],
  ['LP.8','Registro de orientação ao paciente/acompanhante sobre prevenção de LP','PR','[A CONFIRMAR] se exigido para todos ou só para quem tem risco.'],
  ['LP.9','Paciente/cuidador afirma ter sido orientado sobre prevenção de LP','EN','NA se não responde e não há acompanhante.']
 ]},
 {nome:'Meta 6 - Queda', itens:[
  ['QD.1','Risco de queda avaliado na admissão (Morse adulto / Humpty Dumpty pediatria)','PR','Escala de adulto aplicada em criança = NC.'],
  ['QD.2','Risco de queda reavaliado nas últimas 24h','PR','C: escala registrada nas últimas 24h.'],
  ['QD.3','Risco de queda sinalizado na pulseira e na identificação do leito (se RQ = M ou A)','OD+PR','NA se risco baixo. Sem escala: NV (D2).'],
  ['QD.4','Prescrição de enfermagem ajustada ao risco de queda (se RQ avaliado)','PR','Sem escala registrada: NV (D2).'],
  ['QD.5','Grades funcionantes e mantidas elevadas','OD','NC: abaixadas, quebradas ou ausentes. Anotar se é equipamento ou conduta.'],
  ['QD.6','Paciente/cuidador afirma ter sido orientado sobre prevenção de queda','EN','NA se não responde e não há acompanhante.'],
  ['QD.7','Registro de orientação sobre prevenção de queda','PR','[A CONFIRMAR] se exigido para todos ou só para quem tem risco.']
 ]}
];
const ITEM_SETOR = ['M3.4','Controlados (Portaria 344/98) em local trancado, chave com o enfermeiro','SE'];
const ITENS = BLOCOS.flatMap(b=>b.itens.map(i=>({cod:i[0],txt:i[1],fonte:i[2],crit:i[3],bloco:b.nome})));
const ORDEM_REG = [...BLOCOS[0].itens.map(i=>i[0]),...BLOCOS[1].itens.map(i=>i[0]),'M3.1','M3.2','M3.3','M3.4','M3.5',...BLOCOS[3].itens.map(i=>i[0]),...BLOCOS[4].itens.map(i=>i[0])];
const EN_ITENS = ['M1.5','M1.7','M2.1','M3.5','LP.9','QD.6'];
const SETORES = ['Clínica Médica','Clínica Cirúrgica','Clínica Ortopédica','Clínica Oncológica','UTI Adulto 1','UTI Adulto 2','Trauma e Emergência','Box de Emergência'];
const EVENTOS = [
  ['EV.1','Lesão por pressão presente',['N','ADM','INT','SR'],'N = não · ADM = já registrada na admissão · INT = adquirida na internação · SR = sem registro de origem'],
  ['EV.2','Flebite ou sinal de infecção no sítio do cateter',['N','S','NA'],''],
  ['EV.3','Erro de medicação identificado (prescrição, dispensação ou administração)',['N','S'],''],
  ['EV.4','Outro evento',['N','S'],'']
];

/* ---------- Estado e armazenamento ---------- */
let db = {rondas:[], cfg:{rondista:'Victor Matheus Sanches Pivatti', m34:'repetir', setores:{I:SETORES.slice(), II:[]}, leitos:{}, ultimaExport:''}};
let view = {tela:'home', id:null, aba:'cab', crit:{}};
function load(){ try{ const s=localStorage.getItem(STORE_KEY); if(s){ const d=JSON.parse(s); if(d&&Array.isArray(d.rondas)) db=Object.assign(db,d,{cfg:Object.assign({},db.cfg,d.cfg||{})}); if(!db.cfg.setores) db.cfg.setores={I:SETORES.slice(),II:[]}; if(!db.cfg.leitos) db.cfg.leitos={}; } }catch(e){ console.warn('load',e); } }
let saveT=null, saveOk=true;
function save(now){ const f=()=>{ saveT=null; const txt=JSON.stringify(db); IDB.put(txt); try{ localStorage.setItem(STORE_KEY,txt); saveOk=true; }catch(e){ saveOk=false; toast('Não foi possível salvar no aparelho. Exporte agora.'); } paintBottom(); }; if(now){ clearTimeout(saveT); f(); } else if(!saveT) saveT=setTimeout(f,300); }
let protegido=null;
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().then(v=>{protegido=v; if(view.tela==='home') render();}).catch(()=>{}); }catch(e){}
/* Cópia espelhada no IndexedDB: se o localStorage vier vazio ou mais antigo, recupera daqui */
const IDB={ db:null,
  abrir(){ return new Promise((ok,er)=>{ try{ const q=indexedDB.open('rondaNQSP',1); q.onupgradeneeded=()=>q.result.createObjectStore('kv'); q.onsuccess=()=>{this.db=q.result;ok(q.result);}; q.onerror=()=>er(q.error);}catch(e){er(e);} }); },
  async put(v){ try{ const d=this.db||await this.abrir(); d.transaction('kv','readwrite').objectStore('kv').put(v,'db'); }catch(e){} },
  async get(){ try{ const d=this.db||await this.abrir(); return await new Promise(ok=>{ const q=d.transaction('kv').objectStore('kv').get('db'); q.onsuccess=()=>ok(q.result||null); q.onerror=()=>ok(null); }); }catch(e){ return null; } } };
const ultimaAlt=d=>Math.max(0,...(d.rondas||[]).map(r=>Date.parse(r.alterada||0)||0));
async function recuperarIDB(){ const t=await IDB.get(); if(!t) return; try{ const d=JSON.parse(t); if(!d||!Array.isArray(d.rondas)) return;
  const ids=new Set(db.rondas.map(r=>r.id)); const faltam=d.rondas.filter(r=>!ids.has(r.id));
  let mud=0; faltam.forEach(r=>{db.rondas.push(r);mud++;});
  d.rondas.forEach(r=>{ const i=db.rondas.findIndex(x=>x.id===r.id); if(i>=0&&(r.alterada||'')>(db.rondas[i].alterada||'')){ db.rondas[i]=r; mud++; } });
  if(d.cfg&&d.cfg.leitos) db.cfg.leitos=Object.assign({},d.cfg.leitos,db.cfg.leitos);

/* ---------- Regras automáticas (D1, D2, entrevista) ---------- */
function sugestao(p,cod){
  if(EN_ITENS.includes(cod) && p.EN==='N') return ['NA','sem condição de responder e sem acompanhante'];
  if(cod==='M1.4' && p.v['M1.3']==='NC') return ['NA','sem pulseira (M1.3 = NC), D1'];
  if(cod==='LP.4'){ if(p.RB==='B') return ['NA','risco baixo']; if(p.RB==='NV') return ['NV','Braden não registrado (D2)']; }
  if(cod==='LP.5' && p.RB==='NV') return ['NV','Braden não registrado (D2)'];
  if(cod==='LP.6'){ if(p.RB==='B'||p.RB==='M') return ['NA','risco não alto']; if(p.RB==='NV') return ['NV','Braden não registrado (D2)']; }
  if(cod==='QD.3'){ if(p.RQ==='B') return ['NA','risco baixo']; if(p.RQ==='NV') return ['NV','escala de queda não registrada (D2)']; }
  if(cod==='QD.4' && p.RQ==='NV') return ['NV','escala de queda não registrada (D2)'];
  return null;
}
function aplicarAuto(p){
  ITENS.forEach(({cod})=>{
    const s=sugestao(p,cod);
    const forte = s && (cod==='M1.4' || EN_ITENS.includes(cod)) && s[0]==='NA';
    if(s){ if(!p.v[cod]||p.auto[cod]||forte){ p.v[cod]=s[0]; p.auto[cod]=true; if(s[0]==='NV') p.mot[cod]=s[1]; else delete p.mot[cod]; p.obs[cod]=s[0]==='NA'?s[1]:(p.obs[cod]||''); } }
    else if(p.auto[cod]){ delete p.v[cod]; delete p.auto[cod]; delete p.mot[cod]; delete p.obs[cod]; }
  });
}

/* ---------- Sorteio de leitos ---------- */
function parseLista(t){ return [...new Set(String(t||'').split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean))]; }
function rand(n){ const a=new Uint32Array(1); (self.crypto||window.crypto).getRandomValues(a); return a[0]%n; }
// "1-20", "1A-1D", "101A-110B" (grade), "UTI-01" etc.
function expandLeitos(t){
  const out=[]; const src=String(t||'').toUpperCase().replace(/\s*-\s*/g,'-').split(/[\s,;]+/).filter(Boolean);
  const re=/^([A-Z]*)(\d+)([A-Z]?)-([A-Z]*)(\d+)([A-Z]?)$/;
  src.forEach(tok=>{ const m=tok.match(re);
    if(!m||m[1]!==m[4]){ out.push(tok); return; }
    const n1=+m[2], n2=+m[5], w=m[2].length, l1=m[3], l2=m[6];
    if(n2<n1||n2-n1>300){ out.push(tok); return; }
    const num=n=>m[2].startsWith('0')?String(n).padStart(w,'0'):String(n);
    for(let n=n1;n<=n2;n++){
      if(l1&&l2){ for(let c=l1.charCodeAt(0);c<=l2.charCodeAt(0);c++) out.push(m[1]+num(n)+String.fromCharCode(c)); }
      else if(!l1&&!l2) out.push(m[1]+num(n));
      else { out.push(tok); return; }
    }
  });
  return [...new Set(out)].slice(0,400);
}
const chaveSetor=r=>r.unidade+'|'+(r.setor||'').trim();
function leitosSetor(r){ return db.cfg.leitos[chaveSetor(r)]||[]; }
function poolSorteio(r,s){
  if(s.base==='cadastro') return (s.pool||leitosSetor(r)).slice();
  if(s.base==='lista') return parseLista(r.leitosLista);
  return Array.from({length:s.N},(_,i)=>String(i+1));
}
function carimbo(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
function ativos(s){ return s.fila.filter(x=>!s.st[x]); }
function puxar(r,k){ const s=r.sorteio; const ja=new Set(s.fila); const pool=poolSorteio(r,s).filter(x=>!ja.has(x)); let n=0; const novos=[];
  while(n<k&&pool.length){ const x=pool.splice(rand(pool.length),1)[0]; s.fila.push(x); novos.push(x); n++; } return novos; }
function sortear(r){
  const cad=leitosSetor(r); let base, N, pool;
  if(cad.length){ base='cadastro'; pool=cad.slice(); N=cad.length; }
  else { const n=parseInt(r.leitos,10); if(!(n>0)) return 'Cadastre os leitos do setor ou informe o número de leitos ocupados.'; base='posicao'; N=n; }
  const ref=r.sorteio?(r.sorteio.refeito||0)+1:0;
  r.sorteio={em:carimbo(),base,N,pool,fila:[],st:{},mot:{},subst:{},refeito:ref,extras:0};
  puxar(r,4); return null;
}
function sortearMais(r,k){ if(!r.sorteio) return 0; const n=puxar(r,k).length; r.sorteio.extras=(r.sorteio.extras||0)+n; return n; }
// vazio: leito sem paciente, troca por outro sorteado (continua aleatório entre ocupados)
// indisp: paciente não pode ser avaliado, troca por outro e o substituto fica como "reserva" com motivo
function marcarLeito(r,x,tipo,motivo){ const s=r.sorteio; s.st[x]=tipo; if(motivo) s.mot[x]=motivo; const nv=puxar(r,1); if(nv[0]&&tipo==='indisp') s.subst[nv[0]]=x; return nv[0]||''; }
function rotuloLeito(r,x){ return r.sorteio&&r.sorteio.base==='posicao'?x+'º ocupado':'Leito '+x; }
function textoSorteio(r){ const s=r.sorteio; if(!s) return ''; if(!s.fila) return 'versão antiga'; const vz=s.fila.filter(x=>s.st[x]==='vazio'), ind=s.fila.filter(x=>s.st[x]==='indisp');
  return `${({cadastro:'leitos cadastrados',lista:'lista',posicao:'posição no censo'})[s.base]} N=${s.N} | sorteados: ${ativos(s).join(', ')} | vazios: ${vz.join(', ')||'-'} | indisponíveis: ${ind.map(x=>x+(s.mot[x]?' ('+s.mot[x]+')':'')).join(', ')||'-'} | extras ${s.extras||0} | refeito ${s.refeito}x | ${s.em.replace('T',' ')}`; }
function origemAuto(r,p){
  const s=r.sorteio; if(!s||!s.fila||!p.leito.trim()) return;
  if(p.origem&&!p.origemAuto) return;
  const l=p.leito.trim().toUpperCase(); const at=ativos(s).map(x=>x.toUpperCase());
  if(s.base==='posicao'){ return; }
  if(at.includes(l)){ const orig=Object.keys(s.subst).find(k=>k.toUpperCase()===l); if(orig){ p.origem='R'; p.origemMot='substitui leito '+s.subst[orig]+(s.mot[s.subst[orig]]?': '+s.mot[s.subst[orig]]:''); } else p.origem='S'; }
  else p.origem='E';
  p.origemAuto=true;
}
function proxSorteado(r){
  const s=r.sorteio; if(!s||!s.fila) return '';
  const usados=r.pacientes.map(p=>p.leito.trim().toUpperCase());
  return ativos(s).find(x=>!usados.includes(x.toUpperCase()))||'';
}
function novoComLeito(r,np){ const ps=proxSorteado(r); if(ps){ np.leito=ps; np.origemAuto=true; np.origem=''; origemAuto(r,np); } }
/* ---------- Atendimento duplicado no mesmo dia ---------- */
function duplicados(r,p){
  const a=(p.atend||'').trim(); if(!a) return [];
  const L=[]; db.rondas.forEach(x=>{ if(x.data!==r.data) return; x.pacientes.forEach(q=>{ if(q!==p&&(q.atend||'').trim()===a) L.push((x.setor||'sem setor')+' '+q.pos+(x===r?' (esta ronda)':'')); }); });
  return L;
}

/* ---------- Pendências ---------- */
function pendPct(p){
  const vaz=ITENS.filter(i=>!p.v[i.cod]).map(i=>i.cod);
  const nvSem=ITENS.filter(i=>p.v[i.cod]==='NV'&&!(p.mot[i.cod]||'').trim()).map(i=>i.cod);
  const pre=['RB','RQ','EN'].filter(k=>!p[k]);
  const evSem=Object.keys(p.ev).filter(k=>!p.ev[k]);
  const evAchado=['EV.1','EV.2','EV.3','EV.4'].some(k=>['S','INT','SR'].includes(p.ev[k]));
  return {vaz,nvSem,pre,evSem,notFalta:evAchado&&!p.not.trim(),ev4Falta:p.ev['EV.4']==='S'&&!p.ev4desc.trim(),semAtend:!p.atend.trim()};
}
function pendRonda(r){
  const L=[];
  if(!r.setor) L.push('Setor não informado');
  if(!r.leitos) L.push('Leitos ocupados não informado');
  if(!r.m34) L.push('M3.4 (controlados, item de setor) não marcado');
  if(!r.sorteio) L.push('Pacientes não sorteados (seleção sem sorteio)');
  if(r.m34==='NV'&&!r.m34motivo.trim()) L.push('M3.4 = NV sem motivo');
  if(!r.hFim) L.push('Hora de fim não registrada');
  r.pacientes.forEach(p=>{ const q=pendPct(p);
    if(q.semAtend) L.push(p.pos+': nº de atendimento em branco');
    const dp=duplicados(r,p); if(dp.length) L.push(p.pos+': nº de atendimento repetido hoje em '+dp.join(', '));
    if(r.sorteio&&!p.origem) L.push(p.pos+': origem (sorteado/reserva/escolha) não marcada');
    if((p.origem==='R'||p.origem==='E')&&!(p.origemMot||'').trim()) L.push(p.pos+': motivo da '+(p.origem==='R'?'substituição':'escolha')+' em branco');
    if(q.pre.length) L.push(p.pos+': '+q.pre.join(', ')+' em branco');
    if(q.vaz.length) L.push(p.pos+': '+q.vaz.length+' item(ns) em branco ('+q.vaz.join(', ')+')');
    if(q.nvSem.length) L.push(p.pos+': NV sem motivo em '+q.nvSem.join(', '));
    if(q.evSem.length) L.push(p.pos+': eventos não marcados ('+q.evSem.join(', ')+')');
    if(q.notFalta) L.push(p.pos+': evento encontrado sem nº de notificação do Interact');
    if(q.ev4Falta) L.push(p.pos+': EV.4 sem descrição');
  });
  return L;
}

function htmlSorteio(r){

  const usados=r.pacientes.map(p=>p.leito.trim().toUpperCase());
  const chip=x=>{ const st=s.st[x]; const us=usados.includes(x.toUpperCase());
    if(st) return `<span class="chip res">${esc(rotuloLeito(r,x))} · ${st==='vazio'?'vazio':'indisponível'}</span>`;
    return `<span class="lchip${us?' usado':''}"><b>${esc(rotuloLeito(r,x))}</b>${s.subst[x]?'<small>subst. '+esc(s.subst[x])+'</small>':''}${us?'<small>avaliado</small>':`<button type="button" data-vazio="${esc(x)}">Vazio</button><button type="button" data-indisp="${esc(x)}">Indisponível</button>`}</span>`; };
  return `<section class="panel"><h2>Seleção dos pacientes (sorteio)</h2>
    ${!setorOk(r)?'<p style="margin:0;color:var(--muted)">Escolha o setor acima para usar os leitos cadastrados.</p>':''}
    ${setorOk(r)&&edit?`<div class="field"><label for="f_cadL">Leitos do setor ${esc(r.setor)} · cadastro feito uma vez, vale para as próximas rondas</label>
        <textarea id="f_cadL" rows="3" placeholder="ex.: 1A-1C, 2A-2C, 3-12  ou  101-118  ou  UTI01-UTI10">${esc(view.cadTxt??cad.join(', '))}</textarea>
        <span id="cadPrev" style="font-size:13px;color:var(--muted)">${prevLeitos(view.cadTxt??cad.join(', '))}</span></div>
      <div class="btns"><button class="btn primary" id="btnCadL">Salvar leitos do setor</button>${cad.length?'<button class="btn" id="btnCadX">Cancelar</button>':''}</div>`:''}
    ${setorOk(r)&&!edit?`<p style="margin:0;font-size:13px;color:var(--muted)">${cad.length?cad.length+' leitos cadastrados neste setor. ':''}O sorteio usa todos os leitos do setor. Caiu num leito vazio, toque em <b>Vazio</b> e o app sorteia outro. Paciente sem condição de ser avaliado, toque em <b>Indisponível</b> e informe o motivo.</p>`:''}
    ${s?`<div class="chips">${s.fila.map(chip).join('')}</div>
      <p style="margin:0;font-size:12px;color:var(--muted)">Sorteado às ${esc(s.em.slice(11,16))}${s.refeito?` · refeito ${s.refeito} vez(es), fica registrado na exportação`:''}${s.base==='posicao'?' · sem leitos cadastrados: posição na ordem do censo':''}</p>`:''}
    <div class="btns">${!edit&&!s?`<button class="btn primary" id="btnSort">Sortear 4 leitos</button>`:''}
      ${s?'<button class="btn" id="btnMais">Sortear mais 4</button><button class="btn" id="btnSort">Refazer sorteio</button>':''}
      ${setorOk(r)&&!edit?'<button class="btn" id="btnEditL">'+(cad.length?'Editar leitos do setor':'Cadastrar leitos do setor')+'</button>':''}</div>
  </section>`;
}
function setorOk(r){ return !!(r.setor||'').trim(); }
function prevLeitos(t){ const l=expandLeitos(t); return l.length?`${l.length} leitos: ${esc(l.slice(0,24).join(', '))}${l.length>24?' ...':''}`:'Use vírgulas e intervalos: 1-12, 1A-1C, 101A-110B.'; }
function htmlPct(r,p,i){
  const pre=`<section class="panel"><h2>${p.pos} · dados do paciente</h2>
    <div class="row">
      <div class="field" style="flex:0 1 140px"><label for="p_leito">Leito</label><input id="p_leito" value="${esc(p.leito)}"></div>
      <div class="field"><label for="p_atend">Nº do atendimento</label><input id="p_atend" inputmode="numeric" value="${esc(p.atend)}" autocomplete="off"><span class="aviso" id="dupAviso">${duplicados(r,p).length?'Atenção: este nº já foi registrado hoje em '+esc(duplicados(r,p).join(', ')):''}</span></div>
    </div>
    ${r.sorteio?`<div class="row"><div class="field" style="flex:0 0 auto"><label>Origem do paciente</label>${seg('origem',['S','R','E'],p.origem,['Sorteado','Reserva','Escolha'])}</div>
      ${p.origem==='R'||p.origem==='E'?`<div class="field"><label for="p_omot">${p.origem==='R'?'Por que o sorteado foi substituído':'Por que foi escolhido fora do sorteio'}</label><input id="p_omot" class="${!(p.origemMot||'').trim()?'req':''}" style="${!(p.origemMot||'').trim()?'border-color:var(--nv);background:var(--nv-soft)':''}" value="${esc(p.origemMot||'')}"></div>`:''}</div>`:''}
    <div class="row">
      <div class="field" style="flex:0 0 auto"><label>RB · risco de LP (Braden registrada)</label>${seg('RB',['B','M','A','NV'],p.RB)}</div>
      <div class="field" style="flex:0 0 auto"><label>RQ · risco de queda (Morse / Humpty Dumpty)</label>${seg('RQ',['B','M','A','NV'],p.RQ)}</div>
      <div class="field" style="flex:0 0 auto"><label>EN · responde ou há acompanhante</label>${seg('EN',['S','N'],p.EN)}</div>
    </div>
    <p style="margin:0;font-size:12px;color:var(--muted)">B baixo · M moderado · A alto · NV escala não registrada. RB, RQ e EN preenchem sozinhos os itens que dependem deles (marcados "auto"); você pode trocar.</p>
  </section>`;
  const blocos=BLOCOS.map(b=>`<div class="bloco"><h3>${esc(b.nome)}</h3>${b.itens.map(it=>htmlItem(p,it[0])).join('')}</div>`).join('');
  const ev=`<div class="bloco"><h3>Eventos encontrados (fora do REG 005; achado = notificar no Interact)</h3>
    ${EVENTOS.map(e=>`<div class="item"><div class="txt"><span class="cod">${e[0]}</span>${esc(e[1])}${e[3]?`<div style="font-size:12px;color:var(--muted)">${esc(e[3])}</div>`:''}</div>
      <div class="marks" data-ev="${e[0]}">${e[2].map(v=>`<button type="button" data-v="${v}" aria-pressed="${p.ev[e[0]]===v}">${v}</button>`).join('')}</div>
      ${e[0]==='EV.4'&&p.ev['EV.4']==='S'?`<div class="extra"><input id="p_ev4" class="${!p.ev4desc.trim()?'req':''}" placeholder="Descreva o evento" value="${esc(p.ev4desc)}"></div>`:''}</div>`).join('')}
    <div class="item"><div class="txt"><span class="cod">NOT</span>Nº da notificação gerada no Interact</div><div></div>
      <div class="extra"><input id="p_not" class="${pendPct(p).notFalta?'req':''}" inputmode="numeric" placeholder="Separe por vírgula se houver mais de uma" value="${esc(p.not)}"></div></div>
    <div class="item"><div class="txt"><span class="cod">OBS</span>Observações do paciente</div><div></div>
      <div class="extra"><input id="p_obs" value="${esc(p.obsPct)}"></div></div></div>`;
  const nav=`<div class="btns noprint">${i>0?`<button class="btn" data-goto="p${i-1}">‹ ${r.pacientes[i-1].pos}</button>`:''}
    ${i<r.pacientes.length-1?`<button class="btn primary" data-goto="p${i+1}">${r.pacientes[i+1].pos} ›</button>`:(r.pacientes.length<MAX_PCT?'<button class="btn primary" id="addP2">+ Próximo paciente</button>':'')}
    <button class="btn" data-goto="fim">Fechamento</button>
    <button class="btn danger" id="delP">Remover ${p.pos}</button></div>`;
  return pre+blocos+ev+nav;
}

function htmlItem(p,cod){
  const it=ITENS.find(x=>x.cod===cod); const v=p.v[cod]||'';
  const extra = v==='NV' ? `<div class="extra"><input data-mot="${cod}" class="${!(p.mot[cod]||'').trim()?'req':''}" placeholder="Motivo do NV (obrigatório)" value="${esc(p.mot[cod]||'')}"></div>`
    : (v==='NC'||v==='NA') ? `<div class="extra"><input data-obs="${cod}" placeholder="${v==='NC'?'O que faltou ou estava errado (opcional)':'Motivo do NA (opcional)'}" value="${esc(p.obs[cod]||'')}"></div>` : '';
  return `<div class="item${v?'':' vazio'}" id="it-${cod.replace('.','_')}">
    <div class="txt"><span class="cod">${cod}</span>${esc(it.txt)}<span class="fonte">${it.fonte}</span>${p.auto[cod]?'<span class="auto">auto</span>':''}
      <button type="button" class="info" data-crit="${cod}">${view.crit[cod]?'ocultar critério':'critério'}</button></div>
    <div class="marks" data-item="${cod}">${['C','NC','NA','NV'].map(x=>`<button type="button" data-v="${x}" aria-pressed="${v===x}">${x}</button>`).join('')}</div>
    ${view.crit[cod]?`<div class="crit">${esc(it.crit)}</div>`:''}${extra}</div>`;
}

function htmlFim(r){
  const L=pendRonda(r);
  const nc=[]; r.pacientes.forEach(p=>ITENS.forEach(i=>{ if(p.v[i.cod]==='NC') nc.push(`${p.pos} · ${i.cod}${p.obs[i.cod]?': '+p.obs[i.cod]:''}`); if(p.v[i.cod]==='NV') nc.push(`${p.pos} · ${i.cod} NV: ${p.mot[i.cod]||'sem motivo'}`); }));
  if(r.m34==='NC'||r.m34==='NV') nc.unshift(`Setor · M3.4 ${r.m34}${r.m34motivo?': '+r.m34motivo:''}`);
  return `<section class="panel"><h2>Pendências</h2>
      <ul class="pend">${L.length?L.map(x=>`<li>${esc(x)}</li>`).join(''):'<li class="ok">Sem pendências. Pode concluir.</li>'}</ul>
      ${r.hFim?'':'<div class="btns"><button class="btn" id="fimAgora">Registrar hora de fim agora</button></div>'}
    </section>
    <section class="panel"><h2>Não conformidades e motivos de NV (gerado)</h2>
      ${nc.length?`<ul class="pend">${nc.map(x=>`<li style="background:var(--bg)">${esc(x)}</li>`).join('')}</ul>`:'<p style="margin:0;color:var(--muted)">Nenhuma NC ou NV registrada.</p>'}
    </section>
    <section class="panel"><h2>Encaminhamentos / a quem foi comunicado</h2>
      <div class="field"><textarea id="f_enc">${esc(r.encaminhamentos)}</textarea></div>
      <h2>Observações gerais da ronda</h2>
      <div class="field"><textarea id="f_obs">${esc(r.obs)}</textarea></div>
    </section>
    <div class="btns">
      <button class="btn primary" id="concluir">${r.status==='concluida'?'Ronda concluída ✓':'Concluir ronda'}</button>
      <button class="btn" id="verReg">Ver no formato REG 005</button>
      <button class="btn" id="expEsta">Exportar esta ronda (.csv)</button>
      <button class="btn danger" id="delR">Apagar ronda</button>
    </div>`;
}

function renderReg(r){
  const nF=Math.max(1,Math.ceil(r.pacientes.length/4)); const fol0=parseInt(r.folha,10);
  const val=(p,cod,j)=>{ if(!p) return ''; if(cod==='M3.4'){ if(db.cfg.m34==='p1'&&j!==0) return ''; return r.m34==='NV'?'NA':(r.m34||''); } const v=p.v[cod]||''; return v==='NV'?'NA':v; };
  const txt=cod=>cod==='M3.4'?ITEM_SETOR[1]:ITENS.find(i=>i.cod===cod).txt;
  const meta=cod=>({M1:'META 1',M2:'META 2',M3:'META 3',LP:'META 6 (LPP)',QD:'META 6 (QUEDA)'})[cod.slice(0,2)];
  let folhas='';
  for(let f=0;f<nF;f++){
  const cols=r.pacientes.slice(f*4,f*4+4); while(cols.length<4) cols.push(null);
  let last='', rows='';
  ORDEM_REG.forEach(cod=>{ const m=meta(cod); if(m!==last){ rows+=`<tr><td class="meta" colspan="6">${m}</td></tr>`; last=m; }
    const vs=cols.map((p,j)=>val(p,cod,j)); const c=vs.filter(x=>x==='C').length,n=vs.filter(x=>x==='NC').length,a=vs.filter(x=>x==='NA').length;
    rows+=`<tr><td>${esc(txt(cod))}</td>${vs.map(x=>`<td class="v">${x}</td>`).join('')}<td class="tot">C ${c} · NC ${n} · NA ${a}</td></tr>`; });
  folhas+=`<div class="reg"${f?' style="break-before:page;page-break-before:always;margin-top:16px"':''}>
      <div class="hdr"><span><b>REG 005 SEG</b> · ronda ${esc(r.id)} · folha ${f+1} de ${nF}</span><span><b>Data:</b> ${brData(r.data)}</span><span><b>Setor:</b> ${esc(r.setor)}</span><span><b>Unidade:</b> ${esc(r.unidade)}</span><span><b>Avaliador:</b> ${esc(r.rondista)}</span><span><b>Folha nº:</b> ${isNaN(fol0)?esc(r.folha)+(f?' +'+f:''):fol0+f}</span></div>
      <table><thead><tr><th>Item</th>${cols.map((p,i)=>`<th>${p?esc(p.pos):'P'+(f*4+i+1)}${p?`<br><span style="font-weight:400">Atend. ${esc(p.atend)}${p.leito?' · L'+esc(p.leito):''}</span>`:''}</th>`).join('')}<th>TOTAL</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="nota">NV da base vira NA no formulário (não altera a conformidade C ÷ (C + NC)). M3.4: ${db.cfg.m34==='p1'?'registrado só na 1ª coluna de cada folha':'repetido nas colunas dos pacientes'} (decisão D3 pendente). Conformidade do item = C ÷ (C + NC); não dividir C pelo TOTAL.</p>
    </div>`; }
  $('#app').innerHTML=`<div class="btns noprint"><button class="btn" id="voltar">‹ Voltar à ronda</button><button class="btn primary" id="imprimir">Imprimir / salvar PDF</button></div>${folhas}`;
  $('#bottom').hidden=true;
  $('#voltar').onclick=()=>{view.tela='ronda';view.aba='fim';render();};
  $('#imprimir').onclick=()=>{ try{ window.print(); }catch(e){ toast('Impressão indisponível neste navegador.'); } };
}

/* ---------- Eventos ---------- */
function bindRonda(r){
  document.querySelectorAll('[data-aba]').forEach(b=>b.onclick=()=>{view.aba=b.dataset.aba;render();window.scrollTo(0,0);});
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{view.aba=b.dataset.goto;render();window.scrollTo(0,0);});
  const add=()=>{ if(r.pacientes.length>=MAX_PCT) return; const np=novoPct(r.pacientes.length+1);
    if(r.sorteio&&r.sorteio.fila&&!proxSorteado(r)){ if(sortearMais(r,4)) toast('Sorteados mais leitos para a amostra extra.'); else toast('Todos os leitos do setor já foram sorteados.'); }
    novoComLeito(r,np); r.pacientes.push(np); toque(r); save(); view.aba='p'+(r.pacientes.length-1); render(); window.scrollTo(0,0); };
  if($('#addP')) $('#addP').onclick=add; if($('#addP2')) $('#addP2').onclick=add;
  const inp=(id,fn)=>{ const el=$(id); if(el) el.addEventListener('input',e=>{fn(e.target.value);toque(r);save();}); };
  if(view.aba==='cab'){
    inp('#f_setor',v=>r.setor=v); inp('#f_data',v=>r.data=v); inp('#f_hIni',v=>r.hIni=v); inp('#f_hFim',v=>r.hFim=v);
    inp('#f_leitos',v=>r.leitos=v); inp('#f_folha',v=>r.folha=v); inp('#f_resp',v=>r.resp=v); inp('#f_rondista',v=>r.rondista=v);
    const sor=()=>{ const e=sortear(r); if(e){toast(e);return;} r.pacientes.forEach(p=>{ if(p.origemAuto||!p.origem){p.origem='';p.origemAuto=true;} if(!p.leito.trim()&&r.pacientes.length===1) novoComLeito(r,p); else origemAuto(r,p); }); toque(r); save(true); render(); };
    if($('#btnSort')) $('#btnSort').onclick=()=>{ if(r.sorteio&&r.sorteio.fila) confirmar('Refazer o sorteio? O sorteio anterior é substituído e a exportação registra quantas vezes foi refeito.','Refazer',sor); else sor(); };
    if($('#btnMais')) $('#btnMais').onclick=()=>{ const n=sortearMais(r,4); if(!n){toast('Todos os leitos do setor já foram sorteados.');return;} toque(r); save(true); render(); toast(n+' leito(s) a mais sorteado(s).'); };
    if($('#btnEditL')) $('#btnEditL').onclick=()=>{ view.editLeitos=true; view.cadTxt=null; keep(()=>render()); };
    if($('#btnCadX')) $('#btnCadX').onclick=()=>{ view.editLeitos=false; view.cadTxt=null; keep(()=>render()); };
    if($('#f_cadL')) $('#f_cadL').addEventListener('input',e=>{ view.cadTxt=e.target.value; $('#cadPrev').innerHTML=prevLeitos(e.target.value); });
    if($('#btnCadL')) $('#btnCadL').onclick=()=>{ const l=expandLeitos($('#f_cadL').value); if(!l.length){toast('Nenhum leito reconhecido.');return;} db.cfg.leitos[chaveSetor(r)]=l; view.editLeitos=false; view.cadTxt=null; save(true); toast(l.length+' leitos salvos para '+r.setor+'.'); keep(()=>render()); };
    document.querySelectorAll('[data-vazio]').forEach(b=>b.onclick=()=>{ const x=b.dataset.vazio; const nv=marcarLeito(r,x,'vazio'); toque(r); save(true); keep(()=>render()); toast(nv?'Leito '+x+' vazio. Sorteado: '+nv:'Leito '+x+' vazio. Não há mais leitos para sortear.'); });
    document.querySelectorAll('[data-indisp]').forEach(b=>b.onclick=()=>{ const x=b.dataset.indisp; pedirTexto('Por que o paciente do leito '+x+' não pode ser avaliado?','ex.: em procedimento, isolamento, recusou',m=>{ const nv=marcarLeito(r,x,'indisp',m); toque(r); save(true); keep(()=>render()); toast(nv?'Substituto sorteado: '+nv:'Não há mais leitos para sortear.'); }); });
    inp('#f_m34mot',v=>{r.m34motivo=v; $('#f_m34mot').classList.toggle('req',r.m34==='NV'&&!v.trim());});
    $('#f_setor').addEventListener('input',()=>{ $('#ttl').firstChild.nodeValue=(r.setor||'Nova ronda')+' '; });
    $('#f_setor').addEventListener('change',()=>{ view.editLeitos=false; view.cadTxt=null; const y=window.scrollY; render(); window.scrollTo(0,y); });
    document.querySelectorAll('[data-seg]').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;r[g.dataset.seg]=b.dataset.v;toque(r);save();render();});
    $('[data-m34]').onclick=e=>{const b=e.target.closest('button');if(!b)return;r.m34=r.m34===b.dataset.v?'':b.dataset.v;toque(r);save();render();};
  } else if(view.aba==='fim'){
    inp('#f_enc',v=>r.encaminhamentos=v); inp('#f_obs',v=>r.obs=v);
    if($('#fimAgora')) $('#fimAgora').onclick=()=>{r.hFim=agora();toque(r);save();render();};
    const fechar=()=>{ r.status='concluida'; if(!r.hFim) r.hFim=agora(); toque(r); r.concluidaEm=new Date().toISOString(); save(true); render(); confirmar('Ronda concluída. Exportar agora? Até exportar, ela existe só neste iPad.','Exportar agora',()=>exportCsv([r],true)); };
    $('#concluir').onclick=()=>{ const L=pendRonda(r); if(L.length) confirmar(`Ainda há ${L.length} pendência(s). Concluir mesmo assim?`,'Concluir',fechar); else fechar(); };
    $('#verReg').onclick=()=>{view.tela='reg';render();window.scrollTo(0,0);};
    $('#expEsta').onclick=()=>exportCsv([r],true);
    $('#delR').onclick=()=>confirmar('Apagar esta ronda do aparelho? '+(r.exportada?'Ela já foi exportada.':'Ela ainda NÃO foi exportada.'),'Apagar',()=>{db.rondas=db.rondas.filter(x=>x!==r);save(true);view={tela:'home'};render();});
  } else {
    const i=+view.aba.slice(1), p=r.pacientes[i];
    inp('#p_leito',v=>{p.leito=v; if(p.origemAuto) p.origem=''; origemAuto(r,p);});
    $('#p_leito').addEventListener('input',()=>{ document.querySelectorAll('[data-seg="origem"] button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===p.origem))); });
    inp('#p_atend',v=>{p.atend=v; const d=duplicados(r,p); $('#dupAviso').textContent=d.length?'Atenção: este nº já foi registrado hoje em '+d.join(', '):'';});
    inp('#p_omot',v=>{p.origemMot=v;}); inp('#p_obs',v=>p.obsPct=v);
    inp('#p_not',v=>{p.not=v; $('#p_not').classList.toggle('req',pendPct(p).notFalta);});
    inp('#p_ev4',v=>{p.ev4desc=v; $('#p_ev4').classList.toggle('req',!v.trim());});
    document.querySelectorAll('[data-seg]').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=g.dataset.seg;p[k]=p[k]===b.dataset.v?'':b.dataset.v;if(k==='origem')p.origemAuto=false;aplicarAuto(p);toque(r);save();keep(()=>render());});
    document.querySelectorAll('[data-item]').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;const cod=g.dataset.item;
      p.v[cod]=p.v[cod]===b.dataset.v?'':b.dataset.v; if(!p.v[cod]) delete p.v[cod]; delete p.auto[cod]; if(p.v[cod]!=='NV') delete p.mot[cod];
      if(cod==='M1.3') aplicarAuto(p); toque(r); save(); keep(()=>render(), p.v[cod]==='NV'?cod:null);});
    document.querySelectorAll('[data-ev]').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=g.dataset.ev;p.ev[k]=p.ev[k]===b.dataset.v?'':b.dataset.v;toque(r);save();keep(()=>render());});
    document.querySelectorAll('[data-mot]').forEach(el=>el.addEventListener('input',e=>{p.mot[el.dataset.mot]=e.target.value;delete p.auto[el.dataset.mot];el.classList.toggle('req',!e.target.value.trim());toque(r);save();}));
    document.querySelectorAll('[data-obs]').forEach(el=>el.addEventListener('input',e=>{p.obs[el.dataset.obs]=e.target.value;toque(r);save();}));
    document.querySelectorAll('[data-crit]').forEach(b=>b.onclick=()=>{const c=b.dataset.crit;view.crit[c]=!view.crit[c];keep(()=>render());});
    $('#delP').onclick=()=>confirmar(`Remover ${p.pos} desta ronda?`,'Remover',()=>{r.pacientes.splice(i,1);r.pacientes.forEach((q,k)=>q.pos='P'+(k+1));toque(r);save(true);view.aba=r.pacientes.length?'p'+Math.max(0,i-1):'cab';render();});
  }
}
function keep(fn,focusMot){ const y=window.scrollY; fn(); window.scrollTo(0,y); if(focusMot){ const el=document.querySelector(`[data-mot="${focusMot}"]`); if(el) el.focus({preventScroll:true}); } }

function paintBottom(){
  const bt=$('#bottom'); if(view.tela!=='ronda'){ bt.hidden=true; return; }
  const r=ronda(); if(!r){bt.hidden=true;return;}
  bt.hidden=false;
  let info='';
  if(view.aba.startsWith('p')){ const p=r.pacientes[+view.aba.slice(1)]; if(p){ const q=pendPct(p); info=`${p.pos}: ${ITENS.length-q.vaz.length}/${ITENS.length} itens`; } }
  else info=pendRonda(r).length+' pendência(s) na ronda';
  bt.innerHTML=`<span class="st">${esc(info)} · ${saveOk?'salvo no iPad':'<b style="color:var(--nc)">falha ao salvar</b>'}</span>
    ${view.aba.startsWith('p')?'<button class="btn small" id="proxVazio">Próximo em branco</button>':''}`;
  if($('#proxVazio')) $('#proxVazio').onclick=()=>{ const el=document.querySelector('.item.vazio'); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); } else toast('Todos os itens deste paciente estão marcados.'); };
}

/* ---------- Exportação ---------- */
function csvCell(v){ v=String(v??''); return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function linhasCsv(rondas){
  const head=['id_ronda','versao_instrumento','unidade','data','competencia','turno','setor','rondista','resp_setor','folha_reg005','hora_inicio','hora_fim','leitos_ocupados','status','sorteio',
    'pct','leito','n_atendimento','origem','origem_motivo','RB','RQ','EN',...ITENS.map(i=>i.cod),'M3.4','M3.4_motivo','motivos_NV','observacoes_NC_NA','auto_preenchidos','EV.1','EV.2','EV.3','EV.4','EV.4_descricao','NOT','obs_paciente',
    'itens_em_branco','itens_NV','encaminhamentos','obs_ronda'];
  const out=[head];
  rondas.slice().sort((a,b)=>(a.data+a.hIni).localeCompare(b.data+b.hIni)).forEach(r=>{
    r.pacientes.forEach((p,k)=>{
      const mot=ITENS.filter(i=>p.v[i.cod]==='NV').map(i=>i.cod+': '+(p.mot[i.cod]||'sem motivo')).join(' | ');
      const obs=ITENS.filter(i=>(p.v[i.cod]==='NC'||p.v[i.cod]==='NA')&&(p.obs[i.cod]||'').trim()).map(i=>i.cod+': '+p.obs[i.cod]).join(' | ');
      out.push([r.id,r.versao,r.unidade,brData(r.data),(r.data||'').slice(0,7).replace('-',''),r.turno,r.setor,r.rondista,r.resp,r.folha,r.hIni,r.hFim,r.leitos,r.status,textoSorteio(r),
        p.pos,p.leito,p.atend,({S:'sorteado',R:'reserva',E:'escolha'})[p.origem]||'',p.origemMot||'',p.RB,p.RQ,p.EN,...ITENS.map(i=>p.v[i.cod]||''),k===0?r.m34:'',k===0?r.m34motivo:'',mot,obs,Object.keys(p.auto).join(' '),
        p.ev['EV.1'],p.ev['EV.2'],p.ev['EV.3'],p.ev['EV.4'],p.ev4desc,p.not,p.obsPct,
        ITENS.filter(i=>!p.v[i.cod]).length,ITENS.filter(i=>p.v[i.cod]==='NV').length,k===0?r.encaminhamentos:'',k===0?r.obs:'']);
    });
  });
  return out;
}
async function entregar(nome,conteudo,tipo){
  const blob=new Blob([conteudo],{type:tipo});
  try{
    const file=new File([blob],nome,{type:tipo});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:nome}); return true; }
  }catch(e){ if(e&&e.name==='AbortError') return false; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000); return true; }
  catch(e){ toast('Não foi possível gerar o arquivo neste navegador.'); return false; }
}
async function exportCsv(rondas,marcar){
  if(!rondas.length){ toast('Nada para exportar.'); return; }
  const txt='﻿'+linhasCsv(rondas).map(l=>l.map(csvCell).join(';')).join('\r\n');
  const d=new Date(); const nome=`ronda-nqsp_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.csv`;
  const ok=await entregar(nome,txt,'text/csv');
  if(ok&&marcar){ confirmar('O arquivo foi salvo (no Arquivos, Drive ou Skybox)? Se sim, as rondas ficam marcadas como exportadas.','Sim, salvei',()=>{rondas.forEach(r=>r.exportada=true);db.cfg.ultimaExport=new Date().toISOString();save(true);render();}); }
}
async function exportJson(){
  const d=new Date();
  await entregar(`ronda-nqsp_backup_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`,JSON.stringify({app:'ronda-nqsp',versao:APP_VERSION,exportado:d.toISOString(),...db},null,1),'application/json');
}
function importJson(e){
  const f=e.target.files[0]; if(!f) return; const fr=new FileReader();
  fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!Array.isArray(d.rondas)) throw new Error('formato');
      let n=0; d.rondas.forEach(r=>{ const i=db.rondas.findIndex(x=>x.id===r.id); if(i<0){db.rondas.push(r);n++;} else if((r.alterada||'')>(db.rondas[i].alterada||'')){db.rondas[i]=r;n++;} });
      db.rondas.sort((a,b)=>(b.criada||'').localeCompare(a.criada||'')); save(true); toast(n+' ronda(s) restaurada(s) ou atualizada(s).'); render();
    }catch(err){ toast('Arquivo inválido: use um backup .json gerado por este app.'); } };
  fr.readAsText(f);
}

/* ---------- UI auxiliar ---------- */
function confirmar(msg,ok,fn){
  const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="btns" style="justify-content:flex-end"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>${esc(ok)}</button></div></div>`;
  document.body.appendChild(m); m.querySelector('[data-x]').onclick=()=>m.remove(); m.querySelector('[data-ok]').onclick=()=>{m.remove();fn();}; m.querySelector('[data-ok]').focus();
}
function pedirTexto(msg,ph,fn){
  const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><p>${esc(msg)}</p><input id="pt_in" style="min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px 10px" placeholder="${esc(ph)}"><div class="btns" style="justify-content:flex-end"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>Confirmar</button></div></div>`;
  document.body.appendChild(m); const i=m.querySelector('#pt_in'); i.focus();
  m.querySelector('[data-x]').onclick=()=>m.remove(); m.querySelector('[data-ok]').onclick=()=>{ const v=i.value.trim(); if(!v){i.style.borderColor='var(--nc)';return;} m.remove(); fn(v); };
}
let toastT; function toast(t){ let el=$('.toast'); if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);} el.textContent=t; clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),3500); }

$('#btnHome').onclick=()=>{view={tela:'home'};render();window.scrollTo(0,0);};
window.addEventListener('pagehide',()=>save(true));
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') save(true); });
load(); render(); recuperarIDB();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
